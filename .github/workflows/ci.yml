name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch sibling capability libraries
        # The workspace resolves these by :local/root; a bare CI checkout
        # has no sibling tree, so clone the chain. langchain-store itself
        # reaches for langchain (langchain.db), hence both.
        run: |
          mkdir -p ../../kotoba-lang
          git clone https://github.com/kotoba-lang/psa.git ../../kotoba-lang/psa
          git clone https://github.com/kotoba-lang/langchain-store.git ../../kotoba-lang/langchain-store
          git clone https://github.com/kotoba-lang/langchain.git ../../kotoba-lang/langchain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:lint
      - run: clojure -M:test
